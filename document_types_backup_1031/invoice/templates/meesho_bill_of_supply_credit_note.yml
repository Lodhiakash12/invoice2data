# Meesho - credit note against a bill of supply (refund of GT / transport charges).
issuer: Meesho

keywords:
  - 'BILL TO:'
  - 'Credit Note Number'
  - 'Original Bill of Supply Number'
  - 'Sold by:'

required_fields: [issuer, document_type, invoice_number, date, amount, seller_name, original_document_number]

fields:
  document_type: {parser: static, value: credit_note}
  order_number: 'Order Number\s+Credit Note Number\s*\n\s*(\d+)\s+\S+'
  invoice_number: 'Order Number\s+Credit Note Number\s*\n\s*\d+\s+(\S+)'
  original_document_number: 'Original Bill of Supply Number\s*\n\s*(\S+)'
  date_order: 'Order Date\s+Credit Note Date\s*\n[^\n]*?(\d{2}-\d{2}-\d{4})\s+\d{2}-\d{2}-\d{4}'
  date: 'Order Date\s+Credit Note Date\s*\n[^\n]*?\d{2}-\d{2}-\d{4}\s+(\d{2}-\d{2}-\d{4})'
  date_original_document: 'Original Bill of Supply Date\s*\n[^\n]*?(\d{2}-\d{2}-\d{4})'

  buyer_name: {parser: region, heading: '^BILL TO:', max_lines: 1}
  buyer_address: {parser: region, heading: '^BILL TO:', skip: 1, stop: '^Place of Supply'}
  place_of_supply: '(?m)^Place of Supply\s*:\s*(.+?)\s*$'

  seller_name: '(?m)^Sold by:\s*(.+?)\s*$'
  seller_address: 'Sold by:[^\n]*\n\s*(\S[^\n]*?)\s*\n'
  seller_tax_id: '(?m)^GSTIN:\s*(\S+)'

  amount: '(?m)^Total\s+Rs\.\s?([\d,]+\.\d{2})\s*$'

  lines:
    parser: lines
    start: 'SN\.\s+Description'
    end: '(?m)^Total\s'
    first_line: '^\s*(?P<pos>\d+)\s+(?P<name>\S.*?)\s+(?P<hsn_sac>\d{4,8})\s+(?P<qty>\d+|NA)\s+(?:Rs\.\s?)?(?P<gross_amount>\d[\d,]*(?:\.\d+)?)\s+(?:Rs\.\s?)?(?P<discount>\d[\d,]*(?:\.\d+)?)\s+(?:Rs\.\s?)?(?P<price_total>\d[\d,]*(?:\.\d+)?)\s*$'
    line: '^\s+(?P<name>\S.*?)\s*$'
    types:
      pos: int
      gross_amount: float
      discount: float
      price_total: float

options:
  currency: INR
  decimal_separator: '.'
  date_formats: ['%d-%m-%Y']
  replace:
    - ['\r', '']
    - ['(?m)^[ \t]+(\S[^\n]*?)[ \t]*\n(\d+)[ \t]+(\d{6,8}[ \t])', '\2    \1    \3']

layout:
  columns: 12
  sample_pages: 1
  order:
    - ['bill', 0]
    - ['credit', 9]
    - ['note', 10]
    - ['original', 9]
    - ['place', 0]
    - ['supply', 1]
    - ['order', 5]
    - ['number', 5]
    - ['credit', 9]
    - ['note', 10]
    - ['number', 10]
    - ['original', 9]
    - ['bill', 9]
    - ['supply', 10]
    - ['number', 10]
    - ['order', 5]
    - ['date', 6]
    - ['credit', 10]
    - ['note', 10]
    - ['date', 10]
    - ['original', 9]
    - ['bill', 9]
    - ['supply', 10]
    - ['date', 10]
    - ['description', 1]
    - ['total', 9]
    - ['total', 0]
    - ['sold', 0]
    - ['gstin', 0]
