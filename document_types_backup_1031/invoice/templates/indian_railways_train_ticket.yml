# Indian Railways e-ticket (ERS, B2C) booked through an agent (ixigo / Le Travenues): "Boarding From",
# payment details as "Rs. 480/-" rows. Checked on 2 tickets (1 and 2 passengers; the page break falls
# at different places). Its GST block covers the railway fare only (fees are added on top), so the
# untaxed + tax = total check is disabled; the fare rows are checked against the total instead.
issuer: Indian Railways
keywords:
- Electronic Reservation Slip (ERS) - (B2C)
- 'Indian Railways GST Details:'
- 'Transaction ID:'
- PNR
# the last page always ends with the IRCTC contact line, wherever the page break falls
continuation_keywords:
- 'care@irctc.co.in'
required_fields: [issuer, document_type, invoice_number, date, amount, seller_name, seller_address, booking_reference, train_number]
optional_fields: [passengers, amount_untaxed, amount_cgst, amount_sgst, amount_igst, amount_tax, travel_from, travel_to, date_travel, travel_class, place_of_supply]
# Indian Railways rounds the total UP to whole rupees and prints no round-off line (518.15 -> 519)
total_rounding: 1
total_rounding_mode: up
fields:
  document_type: {parser: static, value: invoice}
  seller_name: {parser: static, value: Indian Railways}
  invoice_number: 'Transaction ID:\s*Transaction Id-(\d+)'
  date: '(?m)Ticket Printing Time\s*\n.*?(\d{2}-[A-Za-z]{3}-\d{4})\s+\d{2}:\d{2}'
  date_travel: 'Departure\*\s+\d{2}:\d{2}\s+(\d{2}-[A-Za-z]{3}-\d{4})'
  amount: '(?m)^Total Fare:\s+Rs\.\s*([\d,]+(?:\.\d+)?)/-?\s*$'
  seller_address: '(?m)Invoice Number:\s*\S+\s{2,}Address:\s*(.+?)\s*$'
  amount_untaxed: '(?m)^Taxable Value:\s+(\d[\d.]*)'
  amount_cgst: 'CGST Amount:\s+(\d[\d.]*)'
  amount_sgst: 'SGST/UGST Amount:\s+(\d[\d.]*)'
  amount_igst: '(?m)\s{2,}IGST Amount:\s+(\d[\d.]*)'
  amount_tax: '(?m)^Total Tax:\s+(\d[\d.]*)'
  booking_reference: 'PNR[^\n]*\n\s*(\d{10})\b'
  train_number: 'PNR[^\n]*\n\s*\d{10}\s+(\d+)/'
  travel_from: 'Boarding From[^\n]*\n\s*\n\s*(.+?)\s{2,}'
  travel_to: '(?m)Boarding From[^\n]*\n\s*\n\s*.+?\s{2,}(.+?)\s*$'
  travel_class: '(?m)PNR[^\n]*\n\s*\d{10}\s+\S.*?\s{2,}(\S.*?)\s*$'
  # the number of the last passenger row (the next line is not a passenger row)
  passengers: {parser: regex, regex: '(?m)^(\d+)[ \t]+\S[^\n]*?[ \t]{2,}\d{1,3}[ \t]+[MFT][ \t][^\n]*\n(?!\d+[ \t])', type: int}
  place_of_supply: '(?m)^Place of Supply:\s*([A-Za-z][A-Za-z ]*)'
  lines:
    parser: lines
    start: 'Payment Details:'
    end: '(?m)^Total Fare:'
    line: '^(?P<name>[^:]+):\s+Rs\.\s*(?P<price_total>[\d,]+(?:\.\d+)?)/-?\s*$'
    types: {price_total: float}
checks:
  disable: [untaxed + tax + adjustments = total]
options:
  currency: INR
  decimal_separator: .
  date_formats: ['%d-%b-%Y']
  replace:
  - ["\r", '']

layout:
  columns: 12
  sample_pages: 1
  order:
    - ['electronic', 2]
    - ['reservation', 4]
    - ['slip', 6]
    - ['ers', 7]
    - ['boarding', 2]
