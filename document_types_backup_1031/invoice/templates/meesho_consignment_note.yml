# Meesho / Valmo - consignment note (goods transport record; not a bill, so no amount is required).
issuer: Meesho

keywords:
  - 'Consignment Note Number'
  - 'CONSIGNOR:'
  - 'CONSIGNEE:'

required_fields: [issuer, document_type, invoice_number, date, seller_name]

fields:
  document_type: {parser: static, value: consignment_note}
  invoice_number: 'Consignment Note Number[ \t]*\n[^\n]*?(\S+)[ \t]*\n'
  date: 'Consignment Note Date[\s\S]*?(\d{2}-\d{2}-\d{4})'

  # Consignor = transporter (GTA) acting on behalf of the customer
  seller_name: 'CONSIGNOR:[^\n]*\n\s*(.+?)\s+\(on behalf of'
  on_behalf_of: 'CONSIGNOR:[^\n]*\n[^\n]*\(on behalf of ([^)]+)\)'
  seller_tax_id: 'GTA GSTIN:\s*(\S+)'
  # Origin lines are interleaved with the right-hand date column: drop deeply indented lines
  place_of_origin: {parser: regex, regex: '(?s)Place of Origin\s*:\s*(.*?)\n\s*\n', replace: [['\n[ \t]{20,}[^\n]*', ''], ['\s+', ' ']]}

  buyer_name: 'CONSIGNEE:\s*\n\s*(.+?)\s*\n'
  buyer_address: 'CONSIGNEE:\s*\n[^\n]*\n\s*(\S[^\n]*?)\s*\n'

  reverse_charge: 'reverse charge:\s*(\w+)'
  tax_payer: '(?m)Person Liable to pay tax:\s*(.+?)\s*$'
  # Every transport leg with its vehicle number, in order
  transport_legs: {parser: regex, regex: '(?m)^[ \t]+(\S[^\n]*? to [^\n]*?-\s*[A-Z]{2}\d{1,2}[A-Z]{1,3}\d{3,4})[ \t]*$'}

  lines:
    parser: lines
    start: 'Description of Goods'
    # Goods table ends where the transport legs begin
    end: '(?m)^[ \t]+\S[^\n]* to [^\n]*-\s*[A-Z]{2}\d'
    # "1   Apple iPhone 12 mini BACK COVER   106.0   1   Rs.58.03"
    first_line: '^\s*(?P<pos>\d+)\s+(?P<name>\S.*?)\s+(?P<weight_grams>\d+(?:\.\d+)?)\s+(?P<qty>\d+)\s+Rs\.\s?(?P<goods_value>\d[\d,]*(?:\.\d+)?)\s*$'
    line: '^\s+(?P<name>\S.*?)\s*$'
    types:
      pos: int
      weight_grams: float
      qty: int
      goods_value: float

options:
  currency: INR
  decimal_separator: '.'
  date_formats: ['%d-%m-%Y']
  replace:
    - ['\r', '']

layout:
  columns: 12
  sample_pages: 1
  order:
    - ['consignment', 9]
    - ['note', 10]
    - ['goods', 8]
    - ['gta', 10]
    - ['consignor', 0]
    - ['consignment', 9]
    - ['note', 10]
    - ['number', 10]
    - ['behalf', 3]
    - ['place', 0]
    - ['origin', 1]
    - ['consignment', 9]
    - ['note', 10]
    - ['date', 10]
    - ['consignee', 0]
    - ['consignment', 7]
    - ['description', 1]
    - ['goods', 2]
    - ['goods', 10]
    - ['reverse', 2]
    - ['charge', 3]
    - ['person', 0]
    - ['liable', 1]
    - ['pay', 2]
    - ['tax', 2]
    - ['gta', 2]
    - ['gta', 0]
    - ['gstin', 1]
